version: "3.9"

networks:
  pipeline-net:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  flink-checkpoints:        # shared FsCheckpointStorage dir for JM + TM

x-airflow-env: &airflow-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__FERNET_KEY: ""
  AIRFLOW__API__SECRET_KEY: "5+wlq7e07xXdBcELSRXXvxOaIidOhq8d36J9PIYGgEM="
  AIRFLOW__API_AUTH__JWT_SECRET: "OlINEGSM/N9ZPdX3EdAtfbPAiV3R2D7iwMcTv9W+i6o="
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:ADMIN"
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"

services:
  # ── Kafka ───────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [pipeline-net]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks: [pipeline-net]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list || exit 1"]
      interval: 10s
      retries: 8

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    networks: [pipeline-net]
    entrypoint: /bin/bash
    command:
      - -c
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic page_events --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic dlq_events --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --list

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks: [pipeline-net]

  # ── Object storage ──────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks: [pipeline-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks: [pipeline-net]
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
        mc mb -p local/warehouse || true &&
        mc anonymous set download local/warehouse || true

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    networks: [pipeline-net]

  # ── Flink ───────────────────────────────────────────────────────────────
  flink-jobmanager:
    build:
      context: ./flink_job
      dockerfile: Dockerfile
    image: p1-flink:latest
    depends_on:
      kafka:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        state.checkpoints.dir: file:///opt/flink/checkpoints
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      # job.py reads PARALLELISM at submit time (it runs `flink run` in this
      # container). Kept at 1 so only one PyFlink Beam Python worker spawns —
      # the full 14-service stack + per-slot Python workers otherwise OOM-kill
      # the TaskManager on a ~6 GiB Docker VM. Raise it if you give Docker more memory.
      PARALLELISM: "1"
    command: jobmanager
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    networks: [pipeline-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/overview"]
      interval: 15s
      retries: 8

  flink-taskmanager:
    image: p1-flink:latest
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 1
        taskmanager.memory.process.size: 1280m
        state.checkpoints.dir: file:///opt/flink/checkpoints
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    command: taskmanager
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    networks: [pipeline-net]

  # ── Event generator ─────────────────────────────────────────────────────
  event-generator:
    build:
      context: ./generator
      dockerfile: Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC: page_events
      EVENTS_PER_SECOND: "500"
      NULL_RATE: "0.03"
      SCHEMA_DRIFT_RATE: "0.01"
      LATE_EVENT_RATE: "0.02"
    restart: on-failure
    networks: [pipeline-net]

  # ── Observability ───────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks: [pipeline-net]

  grafana:
    image: grafana/grafana:latest
    depends_on: [prometheus]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks: [pipeline-net]

  # ── Airflow (Astronomer) ────────────────────────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [pipeline-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: p1-airflow:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate
    volumes:
      - ./airflow/dags:/usr/local/airflow/dags
      - ./airflow/airflow_settings.yml:/usr/local/airflow/airflow_settings.yml
    networks: [pipeline-net]

  airflow-webserver:
    image: p1-airflow:latest
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes:
      - ./airflow/dags:/usr/local/airflow/dags
      - ./airflow/airflow_settings.yml:/usr/local/airflow/airflow_settings.yml
    ports:
      - "8082:8080"
    command: airflow api-server
    networks: [pipeline-net]

  airflow-scheduler:
    image: p1-airflow:latest
    depends_on:
      airflow-webserver:
        condition: service_started
    environment:
      <<: *airflow-env
    volumes:
      - ./airflow/dags:/usr/local/airflow/dags
      - ./airflow/airflow_settings.yml:/usr/local/airflow/airflow_settings.yml
    command: airflow scheduler
    networks: [pipeline-net]

  airflow-dag-processor:
    image: p1-airflow:latest
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes:
      - ./airflow/dags:/usr/local/airflow/dags
      - ./airflow/airflow_settings.yml:/usr/local/airflow/airflow_settings.yml
    command: airflow dag-processor
    networks: [pipeline-net]
